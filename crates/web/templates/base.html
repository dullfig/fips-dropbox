<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}fips-dropbox{% endblock %}</title>
<style>
  body { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; line-height: 1.45; }
  h1, h2 { font-weight: 500; margin: 0.2em 0; }
  .card { background: #f7f7f9; border: 1px solid #e0e0e4; border-radius: 8px; padding: 20px; margin: 16px 0; }
  .card.error { background: #fef0f0; border-color: #fbb; color: #a33; }
  .card.success { background: #f0faf2; border-color: #bde4c5; color: #186329; }
  label { display: block; margin: 12px 0 4px; font-size: 14px; color: #555; }
  input[type=text], input[type=email], input[type=password] { width: 100%; padding: 8px 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
  button { padding: 8px 16px; font-size: 15px; background: #0366d6; color: white; border: none; border-radius: 4px; cursor: pointer; }
  button:hover { background: #024ea4; }
  .muted { color: #666; font-size: 14px; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #e0e0e4; padding-bottom: 8px; margin-bottom: 16px; }
  header .right { display: flex; align-items: baseline; gap: 12px; }
  form.inline { display: inline; }
  footer { margin-top: 40px; padding-top: 12px; border-top: 1px solid #eee; color: #888; font-size: 12px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>{% block heading %}fips-dropbox{% endblock %}</h1>
  <div class="right">{% block header_right %}{% endblock %}</div>
</header>
{% block content %}{% endblock %}
<footer>
  fips-dropbox &middot; FIPS-inherited via Windows CNG (CMVP cert #4339)
</footer>
</body>
</html>
